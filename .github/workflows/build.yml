name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  RACK_SDK_VERSION: 2.6.6

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       platform: mac-arm64, shell: bash }
          - { os: macos-13,       platform: mac-x64,   shell: bash }
          - { os: ubuntu-22.04,   platform: lin-x64,   shell: bash }
          - { os: windows-latest, platform: win-x64,   shell: 'msys2 {0}' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git make zip unzip zstd curl
            mingw-w64-x86_64-gcc mingw-w64-x86_64-jq

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install jq zstd

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq zstd unzip

      - name: Fetch Rack SDK
        run: ./scripts/fetch-sdk.sh "$RACK_SDK_VERSION"

      - name: Build
        run: make -j4 dist

      - uses: actions/upload-artifact@v4
        with:
          name: vcvplugin-${{ matrix.platform }}
          path: dist/*.vcvplugin

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.vcvplugin
